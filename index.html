<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supply Lines</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="hud">
    <div id="hud-left">
      <span id="hud-week">Week 1</span>
      <div id="week-bar"><div id="week-bar-fill"></div></div>
      <span id="hud-delivered">0</span> delivered
      <span id="hud-freight"></span>
    </div>
    <div id="hud-right">
      <span id="hud-colors"></span>
      <button id="btn-pause" title="Space">&#10074;&#10074;</button>
      <button id="btn-1x" class="speed on">1&times;</button>
      <button id="btn-2x" class="speed">2&times;</button>
    </div>
  </div>
  <div id="canvas-wrap">
    <div id="canvas-inner">
      <canvas id="game"></canvas>
      <div id="hotbar">
        <button id="hot-road" class="hot" title="Road tool (R)">
          <svg viewBox="0 0 28 28" width="30" height="30">
            <rect x="8" y="3" width="12" height="22" rx="2.5" fill="#8b857c"/>
            <line x1="14" y1="6" x2="14" y2="22" stroke="#f5f2ec" stroke-width="1.8" stroke-dasharray="3.5 3.5"/>
          </svg>
          <span class="hot-badge" id="hot-road-count">0</span>
        </button>
        <button id="hot-line" class="hot" title="Line tool (L)">
          <svg viewBox="0 0 28 28" width="30" height="30">
            <polyline points="5,22 13,12 21,12" fill="none" stroke="#457b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="5" cy="22" r="3.6" fill="#f5f2ec" stroke="#457b9d" stroke-width="2.2"/>
            <rect x="17" y="7" width="9" height="9" rx="1.5" fill="#457b9d"/>
          </svg>
          <span class="hot-badge" id="hot-line-count">0</span>
        </button>
      </div>
      <div id="subbar" class="hidden">
        <button id="hot-junction" class="hot sub" title="Junction (J) — interchange stop on a line's track">
          <svg viewBox="0 0 28 28" width="22" height="22">
            <circle cx="14" cy="14" r="8" fill="none" stroke="#6b6560" stroke-width="3"/>
          </svg>
        </button>
        <button id="hot-bus" class="hot sub hidden" title="Bus route (U) — transit over existing roads">
          <svg viewBox="0 0 28 28" width="22" height="22">
            <rect x="4" y="7" width="20" height="13" rx="4" fill="#457b9d"/>
            <rect x="7" y="10" width="4" height="4" rx="1" fill="#f5f2ec"/>
            <rect x="12" y="10" width="4" height="4" rx="1" fill="#f5f2ec"/>
            <rect x="17" y="10" width="4" height="4" rx="1" fill="#f5f2ec"/>
            <circle cx="9" cy="21" r="2" fill="#4a453f"/>
            <circle cx="19" cy="21" r="2" fill="#4a453f"/>
          </svg>
          <span class="hot-badge" id="hot-bus-count">0</span>
        </button>
      </div>
      <div id="roadbar" class="hidden">
        <button id="hot-bulldoze" class="hot sub" title="bulldozer">
          <svg viewBox="0 0 28 28" width="24" height="24">
            <rect x="8" y="5" width="7" height="8" rx="1" fill="#6b6560"/>
            <rect x="4" y="12" width="14" height="5" rx="1.5" fill="#6b6560"/>
            <rect x="3" y="17" width="16" height="5" rx="2.5" fill="#4a453f"/>
            <line x1="18" y1="13" x2="23" y2="17" stroke="#6b6560" stroke-width="2.2" stroke-linecap="round"/>
            <rect x="21" y="13" width="5" height="9" rx="1" fill="#e63946"/>
          </svg>
        </button>
        <button id="hot-motorway" class="hot sub hidden" title="Motorway (M) — elevated express road">
          <svg viewBox="0 0 28 28" width="24" height="24">
            <rect x="3" y="16" width="22" height="4.5" rx="2" fill="#b0a99c"/>
            <path d="M5 23 Q14 3 23 23" fill="none" stroke="#4a453f" stroke-width="5.5" stroke-linecap="round"/>
            <path d="M5 23 Q14 3 23 23" fill="none" stroke="#f5f2ec" stroke-width="1.2" stroke-dasharray="3 3.5"/>
          </svg>
          <span class="hot-badge" id="hot-motor-count">0</span>
        </button>
        <button id="hot-roundabout" class="hot sub hidden" title="Roundabout (O) — free-flow junction">
          <svg viewBox="0 0 28 28" width="24" height="24">
            <circle cx="14" cy="14" r="8.5" fill="none" stroke="#4a453f" stroke-width="5"/>
            <circle cx="14" cy="14" r="8.5" fill="none" stroke="#f5f2ec" stroke-width="1.1" stroke-dasharray="3 3.5"/>
            <path d="M7.5 4.5 L13.5 5.5 L9 10.5 Z" fill="#4a453f"/>
          </svg>
          <span class="hot-badge" id="hot-round-count">0</span>
        </button>
        <button id="hot-light" class="hot sub hidden" title="Traffic light (T) — phase-controlled junction">
          <svg viewBox="0 0 28 28" width="24" height="24">
            <rect x="9" y="3" width="10" height="22" rx="5" fill="#4a453f"/>
            <circle cx="14" cy="8" r="2.3" fill="#e63946"/>
            <circle cx="14" cy="14" r="2.3" fill="#e9a13b"/>
            <circle cx="14" cy="20" r="2.3" fill="#2ecc71"/>
          </svg>
          <span class="hot-badge" id="hot-light-count">0</span>
        </button>
        <button id="hot-bridge" class="hot sub hidden" title="Bridges — drawing a road across water spends them">
          <svg viewBox="0 0 28 28" width="24" height="24">
            <path d="M4 15 Q14 6 24 15" fill="none" stroke="#8b857c" stroke-width="4" stroke-linecap="round"/>
            <rect x="3" y="12" width="22" height="4.5" rx="2" fill="#4a453f"/>
            <path d="M4 22 Q8.5 20 13 22 T22 22" fill="none" stroke="#71b3d6" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="hot-badge" id="hot-bridge-count">0</span>
        </button>
      </div>
      <canvas id="minimap"></canvas>
    </div>
  </div>
  <div id="modal" class="hidden">
    <div id="modal-card">
      <h2 id="modal-title">End of week</h2>
      <div id="modal-options"></div>
    </div>
  </div>
  <div id="gameover" class="hidden">
    <div id="gameover-card">
      <h2>Game over</h2>
      <div id="gameover-stars"></div>
      <p id="gameover-reason"></p>
      <p id="gameover-stats"></p>
      <p id="gameover-best"></p>
      <button onclick="location.reload()">Play again</button>
    </div>
  </div>
  <div id="pausemenu" class="hidden">
    <div id="pause-card">
      <h2>Paused</h2>
      <div id="pause-options">
        <button id="pause-resume">Resume</button>
        <button id="pause-levels">Levels</button>
        <button id="pause-restart">Restart</button>
      </div>
    </div>
  </div>
  <div id="levels" class="hidden">
    <button id="levels-back">&#8592; Back</button>
    <div id="levels-inner">
      <h2 id="levels-title">Levels</h2>
      <div id="level-grid">
        <div class="level-card" id="level-map1">
          <div class="level-thumb"></div>
          <div class="level-name">Map 1</div>
        </div>
        <div class="level-card" id="level-map2">
          <div class="level-thumb level-thumb-sand"></div>
          <div class="level-name">Map 2</div>
        </div>
        <div class="level-card" id="level-map3">
          <div class="level-thumb level-thumb-moss"></div>
          <div class="level-name">Map 3</div>
        </div>
        <div class="level-card level-ghost">
          <div class="level-thumb"></div>
          <div class="level-name">More cities soon</div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
