<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supply Lines</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="hud">
    <div id="hud-left">
      <span id="hud-week">Week 1</span>
      <div id="week-bar"><div id="week-bar-fill"></div></div>
      <span id="hud-delivered">0</span> delivered
      <span id="hud-freight"></span>
    </div>
    <div id="hud-right">
      <span id="hud-colors"></span>
      <button id="btn-pause" title="Space">&#10074;&#10074;</button>
      <button id="btn-1x" class="speed on">1&times;</button>
      <button id="btn-2x" class="speed">2&times;</button>
    </div>
  </div>
  <div id="canvas-wrap">
    <div id="canvas-inner">
      <canvas id="game"></canvas>
      <div id="hotbar">
        <button id="hot-road" class="hot" title="Road tool (R)">
          <svg viewBox="0 0 28 28" width="30" height="30">
            <rect x="8" y="3" width="12" height="22" rx="2.5" fill="#8b857c"/>
            <line x1="14" y1="6" x2="14" y2="22" stroke="#f5f2ec" stroke-width="1.8" stroke-dasharray="3.5 3.5"/>
          </svg>
          <span class="hot-badge" id="hot-road-count">0</span>
        </button>
        <button id="hot-line" class="hot" title="Freight line tool (L)">
          <svg viewBox="0 0 28 28" width="30" height="30">
            <polyline points="5,22 13,12 21,12" fill="none" stroke="#457b9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="5" cy="22" r="3.6" fill="#f5f2ec" stroke="#457b9d" stroke-width="2.2"/>
            <rect x="17" y="7" width="9" height="9" rx="1.5" fill="#457b9d"/>
          </svg>
          <span class="hot-badge" id="hot-line-count">0</span>
        </button>
      </div>
      <div id="subbar" class="hidden">
        <button id="hot-junction" class="hot sub" title="junction">
          <svg viewBox="0 0 28 28" width="22" height="22">
            <circle cx="14" cy="14" r="8" fill="none" stroke="#6b6560" stroke-width="3"/>
          </svg>
        </button>
      </div>
      <div id="roadbar" class="hidden">
        <button id="hot-bulldoze" class="hot sub" title="bulldozer">
          <svg viewBox="0 0 28 28" width="24" height="24">
            <rect x="8" y="5" width="7" height="8" rx="1" fill="#6b6560"/>
            <rect x="4" y="12" width="14" height="5" rx="1.5" fill="#6b6560"/>
            <rect x="3" y="17" width="16" height="5" rx="2.5" fill="#4a453f"/>
            <line x1="18" y1="13" x2="23" y2="17" stroke="#6b6560" stroke-width="2.2" stroke-linecap="round"/>
            <rect x="21" y="13" width="5" height="9" rx="1" fill="#e63946"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
  <div id="modal" class="hidden">
    <div id="modal-card">
      <h2 id="modal-title">End of week</h2>
      <div id="modal-options"></div>
    </div>
  </div>
  <div id="gameover" class="hidden">
    <div id="gameover-card">
      <h2>Game over</h2>
      <p id="gameover-reason"></p>
      <p id="gameover-stats"></p>
      <button onclick="location.reload()">Play again</button>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
